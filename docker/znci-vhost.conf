# znci.ir — Apache reverse proxy in front of the Docker container (host SC1).
#
# Canonical copy. The live file is /etc/apache2/vhosts.d/znci.conf on SC1; this
# repo copy is the reference, mirroring how ops/ holds the zarrinac.com scripts.
# Pattern matches zarrin-ng-site's /etc/apache2/sites-available/zarrinac.conf,
# minus the `Alias /media/` block: znci serves /media/* from the container's own
# public/ bind mount, so nothing is read off the host disk by Apache.
#
# Requires on SC1:
#   /etc/ssl/znci/fullchain.crt   0644 root:root  (leaf + Certum DV TLS G2 R39 CA + Certum Trusted Root CA)
#   /etc/ssl/znci/znci.key        0600 root:root  (private key matching the leaf)
#   APACHE_SERVER_FLAGS="SSL" in /etc/sysconfig/apache2  (this is what opens Listen 443)
# See docker/README.md → "TLS" for the install runbook.

<VirtualHost *:80>
    ServerName znci.ir
    ServerAlias www.znci.ir

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog /var/log/apache2/znci-error.log
    CustomLog /var/log/apache2/znci-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName znci.ir
    ServerAlias www.znci.ir

    ErrorLog /var/log/apache2/znci-error.log
    CustomLog /var/log/apache2/znci-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/ssl/znci/fullchain.crt
    SSLCertificateKeyFile /etc/ssl/znci/znci.key

    # proxy.ts reads x-forwarded-host / x-forwarded-proto for the admin
    # same-origin check on mutating requests — both headers are load-bearing.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/
</VirtualHost>
